<script type="module">
import { render, Parser } from './dist/mslang.esm.js';

// 暴露到 window 供 onclick 使用
window.render = render;
window.Parser = Parser;

// 自定义函数（经 render options 注入，无需实例）
const greet = (name, kwargs) => {
  const style = kwargs.style || '';
  return `<span style="${style}">👋 你好, ${name}!</span>`;
};

// 实时渲染
const textarea = document.getElementById('source');
const output = document.getElementById('output');
const status = document.getElementById('status');
const modeLabel = document.getElementById('mode-label');

let debounceTimer;
textarea.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(renderMSL, 400);
});

window.renderMSL = function() {
  try {
    const source = textarea.value;
    const start = performance.now();
    const html = render(source, { functions: { greet } });
    const elapsed = (performance.now() - start).toFixed(1);
    output.innerHTML = html;
    renderMermaid();
    modeLabel.textContent = 'HTML';
    status.innerHTML = `✅ 渲染成功 &mdash; 耗时 ${elapsed}ms`;
  } catch (err) {
    output.innerHTML = `<div style="color:#c0392b;padding:20px"><strong>错误:</strong> ${err.message}</div>`;
    status.textContent = '❌ ' + err.message;
  }
};

// mermaid 流程图渲染（CDN 加载失败时静默跳过）
function renderMermaid() {
  if (!window.mermaid) return;
  try {
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    mermaid.run({ nodes: output.querySelectorAll('.mermaid') });
  } catch (err) { /* mermaid 渲染失败不阻塞页面 */ }
}

window.showAST = function() {
  try {
    const source = textarea.value;
    const parser = new Parser();
    const ast = parser.parseText(source);
    output.innerHTML = `<pre style="font-size:13px;line-height:1.5;white-space:pre-wrap">${escapeHTML(parser.dumpAST(ast))}</pre>`;
    modeLabel.textContent = 'AST';
    status.innerHTML = `✅ AST 构建成功 &mdash; ${ast.blocks.length} 个块级节点`;
  } catch (err) {
    output.innerHTML = `<div style="color:#c0392b">错误: ${err.message}</div>`;
    status.textContent = '❌ ' + err.message;
  }
};

window.loadExample = function() {
  renderMSL();
};

// HTML 转义工具
function escapeHTML(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
window.escapeHTML = escapeHTML;

// 初始渲染
renderMSL();
</script>

<!-- mermaid 流程图渲染引擎（CDN；renderMSL 内对 .mermaid 元素调用 run()） -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
