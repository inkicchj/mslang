<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mslang CDN 演示</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      border-bottom: 2px solid #667eea;
      padding-bottom: 8px;
    }

    pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
    }

    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .success {
      color: #27ae60;
    }

    .mslang {
      line-height: 1.8;
    }

    .mslang h1,
    .mslang h2 {
      margin: 0.5em 0 0.2em;
    }

    .mslang p {
      margin: 0.4em 0;
    }

    .mslang blockquote {
      border-left: 3px solid #667eea;
      padding: 0.2em 1em;
      background: #f0f2ff;
    }

    .mslang table {
      border-collapse: collapse;
      width: 100%;
    }

    .mslang th,
    .mslang td {
      border: 1px solid #ddd;
      padding: 6px 12px;
    }

    .mslang th {
      background: #f8f9fa;
    }

    .mslang a {
      color: #667eea;
    }
  </style>
</head>

<body>

  <h1>mslang CDN 测试</h1>
  <p>使用 <code>&lt;script src="dist/mslang.iife.min.js"&gt;</code> 加载</p>

  <div id="output"></div>

  <hr>
  <h2>源代码</h2>
  <pre id="source-display"></pre>

  <script src="mslang.iife.min.js"></script>
  <script>
    const source = `# mslang CDN 演示 ✅

## 格式测试

一段 **加粗** 和 *斜体* 文本，还有 ~~删除线~~。

## 颜色与链接

这是 /#e74c3c:红色文字:/ 和内嵌 URL: https://github.com

## 表格

| 功能 | 状态 |
|------|------|
| 标题 | ✅ |
| 列表 | ✅ |
| 链接 | ✅ |

---

> 引用块测试。

\`\`\`js
console.log('hello mslang!')
\`\`\`
`;

    document.getElementById('source-display').textContent = source;

    try {
      const html = window.mslang.mslangToHTML(source);
      document.getElementById('output').innerHTML =
        '<p class="success">✅ IIFE 打包加载成功！global <code>window.mslang</code> 可用</p>' + html;
    } catch (e) {
      document.getElementById('output').innerHTML =
        '<p style="color:red">❌ 错误: ' + e.message + '</p>';
    }
  </script>

</body>

</html>
